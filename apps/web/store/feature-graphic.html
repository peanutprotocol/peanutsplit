<!doctype html>
<!--
    The Google Play feature graphic, 1024 x 500 (PLAN 7.3). e2e-native/store-screenshots.spec.ts
    opens this file and writes store/assets/feature-graphic.jpg. Brand sources only: the Split
    mark (src/assets/logos/split-mark.svg), Gluten (public/fonts) for the wordmark, Roboto Flex
    (@fontsource-variable/roboto-flex) for the landing page's condensed display type, and the
    colours of the default pink room theme and tailwind.config.js. The headline is the landing
    page H1.
    Play may crop the edges and lay a play button over the centre on some surfaces, so the words
    stay on the left and the mark on the right.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Peanut Split feature graphic</title>
        <style>
            @font-face {
                font-family: 'Gluten';
                src: url('../public/fonts/gluten-latin-400.woff2') format('woff2');
                font-weight: 400;
            }
            @font-face {
                font-family: 'Roboto Flex';
                src: url('../node_modules/@fontsource-variable/roboto-flex/files/roboto-flex-latin-full-normal.woff2')
                    format('woff2');
                font-weight: 100 1000;
                font-stretch: 25% 151%;
            }
            :root {
                --ink: #211c17;
                --pink: #ff90e8;
                --yellow: #ffc900;
                --cream: #faf4f0;
            }
            * {
                box-sizing: border-box;
                margin: 0;
            }
            html,
            body {
                width: 1024px;
                height: 500px;
                overflow: hidden;
            }
            body {
                position: relative;
                background: var(--pink);
                color: var(--ink);
                font-family: 'Roboto Flex', sans-serif;
            }
            .copy {
                position: absolute;
                left: 56px;
                top: 0;
                bottom: 0;
                width: 560px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .wordmark {
                font-family: 'Gluten', sans-serif;
                font-size: 28px;
                letter-spacing: 0.02em;
            }
            h1 {
                margin-top: 14px;
                font:
                    1000 72px/0.95 'Roboto Flex',
                    sans-serif;
                font-stretch: 50%;
                letter-spacing: -0.045em;
            }
            h1 mark {
                padding-inline: 0.08em;
                background: var(--yellow);
                color: var(--ink);
            }
            .lede {
                margin-top: 18px;
                font:
                    700 24px/1.3 'Roboto Flex',
                    sans-serif;
            }
            .chips {
                display: flex;
                gap: 12px;
                margin-top: 20px;
            }
            .chip {
                padding: 8px 18px;
                background: var(--cream);
                border: 3px solid var(--ink);
                border-radius: 9999px;
                box-shadow: 3px 3px 0 var(--ink);
                font-size: 19px;
                font-weight: 900;
            }
            .disc {
                position: absolute;
                right: 60px;
                top: 50%;
                width: 260px;
                height: 260px;
                transform: translateY(-50%) rotate(-8deg);
                filter: drop-shadow(8px 8px 0 var(--ink));
            }
        </style>
    </head>
    <body>
        <main class="copy">
            <div class="wordmark">PEANUT SPLIT</div>
            <h1>GOOD <mark>ACCOUNTING</mark><br />MAKES <mark>GOOD</mark><br /><mark>FRIENDS.</mark></h1>
            <p class="lede">Share one link. Everyone adds what they paid.</p>
            <div class="chips">
                <span class="chip">No signup</span>
                <span class="chip">Scan receipts</span>
                <span class="chip">156 currencies</span>
            </div>
        </main>

        <img class="disc" src="../src/assets/logos/split-mark.svg" alt="" />
    </body>
</html>
