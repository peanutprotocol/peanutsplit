name: Bug report
description: Report a reproducible Peanut Split defect using synthetic data.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include live room links, tokens, personal data, expense exports, or vulnerability details.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest synthetic sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release commit
      description: The 40-character public release commit, if known.
