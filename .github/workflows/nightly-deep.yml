name: Split install offline assets QA

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run the notification setup release checks
        required: false
        default: true
        type: boolean
      focus:
        description: Optional Playwright test-name pattern for a targeted rerun
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: split-install-offline-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Install and notification journeys (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      E2E_DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_BASE_URL: https://localhost:8777
      E2E_SKIP_GLOBAL_SETUP: '1'
      E2E_WORKERS: 1
      SPLIT_FX_MODE: static
      NEXT_PUBLIC_BASE_URL: https://peanutsplit.com
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: aGkh
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peanut
          POSTGRES_PASSWORD: peanut
          POSTGRES_DB: peanut_split_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peanut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm bootstrap
      - run: env -u DATABASE_URL DATABASE_URL="$E2E_DATABASE_URL" pnpm --dir apps/web exec prisma migrate deploy
      - run: pnpm --dir apps/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build the app used by the browser journeys
        run: |
          set -euo pipefail
          pnpm --dir apps/web build 2>&1 | tee "${RUNNER_TEMP}/split-browser-build.log"
      - name: Start the production app behind local HTTPS
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "${RUNNER_TEMP}/split-localhost-key.pem" \
            -out "${RUNNER_TEMP}/split-localhost-cert.pem" \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          pnpm --dir apps/web start --port 8778 > "${RUNNER_TEMP}/split-web.log" 2>&1 &
          cat > "${RUNNER_TEMP}/split-https-proxy.mjs" <<'NODE'
          import https from 'node:https'
          import http from 'node:http'
          import fs from 'node:fs'
          const temp = process.env.RUNNER_TEMP
          https.createServer({
            key: fs.readFileSync(`${temp}/split-localhost-key.pem`),
            cert: fs.readFileSync(`${temp}/split-localhost-cert.pem`),
          }, (request, response) => {
            const upstream = http.request({
              hostname: '127.0.0.1', port: 8778, method: request.method, path: request.url,
              headers: {
                ...request.headers,
                'x-forwarded-host': request.headers['x-forwarded-host'] ?? request.headers.host,
                'x-forwarded-proto': 'https',
              },
            }, (result) => {
              response.writeHead(result.statusCode ?? 502, result.headers)
              result.pipe(response)
            })
            upstream.on('error', (error) => {
              if (!response.headersSent) response.writeHead(502)
              response.end('Local QA proxy could not reach Next')
              console.error(error.message)
            })
            request.on('aborted', () => upstream.destroy())
            response.on('close', () => { if (!response.writableEnded) upstream.destroy() })
            request.pipe(upstream)
          }).listen(8777)
          NODE
          node "${RUNNER_TEMP}/split-https-proxy.mjs" > "${RUNNER_TEMP}/split-proxy.log" 2>&1 &
          for attempt in {1..120}; do
            if curl --insecure --fail --silent https://localhost:8777/healthcheck > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/split-web.log"
          exit 1
      - name: Warm the targeted routes over local HTTPS
        run: |
          for path in / /app /new /import; do
            curl --insecure --fail --silent --max-time 180 "https://localhost:8777${path}" > /dev/null
          done
          room_slug="$(curl --insecure --fail --silent https://localhost:8777/api/rooms \
            -H 'Content-Type: application/json' -H 'x-forwarded-for: 10.255.255.254' \
            --data '{"name":"QA warmup","currency":"EUR","creatorName":"Ana"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).room.slug')"
          for path in "/r/${room_slug}" "/r/${room_slug}/import" "/r/${room_slug}/card/invite"; do
            curl --insecure --fail --silent --max-time 180 "https://localhost:8777${path}" > /dev/null
          done
      - name: Verify product and content service-worker boundaries
        if: matrix.browser == 'chromium'
        env:
          PWA_BOUNDARY_PRODUCT_ORIGIN: http://localhost:8778
          PWA_BOUNDARY_CONTENT_ORIGIN: http://localhost:8778
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec playwright test --config playwright.pwa-boundary.config.ts \
            --workers=1 --retries=0 --trace=retain-on-failure --reporter=list \
            --output=boundary-test-results \
            2>&1 | tee "${RUNNER_TEMP}/split-boundary.log"
      - name: Keep screenshots, traces, reports and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-offline-browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/boundary-test-results
            ${{ runner.temp }}/split-boundary.log
            ${{ runner.temp }}/split-web.log
            ${{ runner.temp }}/split-proxy.log
            ${{ runner.temp }}/split-browser-build.log
            ${{ runner.temp }}/split-browser.log
          if-no-files-found: ignore
          retention-days: 14
