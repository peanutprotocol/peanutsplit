name: Split notification setup QA

on:
  workflow_dispatch:
    inputs:
      force:
        description: Run the notification setup release checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: split-notification-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      TEST_DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      PEANUT_WEBHOOK_SECRET: local-dev-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peanut
          POSTGRES_PASSWORD: peanut
          POSTGRES_DB: peanut_split_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peanut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm bootstrap
      - run: env -u DATABASE_URL DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter @peanut-split/api exec prisma migrate deploy
      - name: Build both apps
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee "${RUNNER_TEMP}/split-build.log"
      - name: Start the API used by the settlement verifier
        run: |
          pnpm --filter @peanut-split/api exec tsx src/index.ts > "${RUNNER_TEMP}/split-api.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5051/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/split-api.log"
          exit 1
      - name: Full repository gate
        run: |
          set -euo pipefail
          pnpm verify 2>&1 | tee "${RUNNER_TEMP}/split-verify.log"
      - name: Keep verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-verify-${{ github.sha }}
          path: |
            ${{ runner.temp }}/split-build.log
            ${{ runner.temp }}/split-api.log
            ${{ runner.temp }}/split-verify.log
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Notification journeys (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=3072
      DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      E2E_DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_BASE_URL: https://localhost:8777
      E2E_SKIP_GLOBAL_SETUP: '1'
      E2E_WORKERS: 2
      SPLIT_FX_MODE: static
      NEXT_PUBLIC_BASE_URL: https://localhost:8777
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: aGkh
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peanut
          POSTGRES_PASSWORD: peanut
          POSTGRES_DB: peanut_split_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peanut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm bootstrap
      - run: env -u DATABASE_URL DATABASE_URL="$E2E_DATABASE_URL" pnpm --dir apps/web exec prisma migrate deploy
      - run: pnpm --dir apps/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start the HTTPS app for secure installation cookies
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout "${RUNNER_TEMP}/split-localhost-key.pem" \
            -out "${RUNNER_TEMP}/split-localhost-cert.pem" \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          pnpm --dir apps/web dev --webpack --port 8777 --experimental-https \
            --experimental-https-key "${RUNNER_TEMP}/split-localhost-key.pem" \
            --experimental-https-cert "${RUNNER_TEMP}/split-localhost-cert.pem" \
            > "${RUNNER_TEMP}/split-web.log" 2>&1 &
          for attempt in {1..120}; do
            if curl --insecure --fail --silent https://localhost:8777/healthcheck > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/split-web.log"
          exit 1
      - name: Warm the targeted routes over local HTTPS
        run: |
          for path in / /app /new /import; do
            curl --insecure --fail --silent --max-time 180 "https://localhost:8777${path}" > /dev/null
          done
          room_slug="$(curl --insecure --fail --silent https://localhost:8777/api/rooms \
            -H 'Content-Type: application/json' -H 'x-forwarded-for: 10.255.255.254' \
            --data '{"name":"QA warmup","currency":"EUR","creatorName":"Ana"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).room.slug')"
          for path in "/r/${room_slug}" "/r/${room_slug}/import" "/r/${room_slug}/card/invite"; do
            curl --insecure --fail --silent --max-time 180 "https://localhost:8777${path}" > /dev/null
          done
      - name: Verify the new flow and existing installation and Settings journeys
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec playwright test \
            e2e/notification-flow.spec.ts \
            e2e/install-retention.spec.ts \
            e2e/install-handoff.spec.ts \
            e2e/pwa.spec.ts \
            e2e/room-settings.spec.ts \
            --workers=2 --retries=0 --reporter=list,html \
            2>&1 | tee "${RUNNER_TEMP}/split-browser.log"
      - name: Keep screenshots, traces, reports and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notification-browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/split-web.log
            ${{ runner.temp }}/split-browser.log
          if-no-files-found: ignore
          retention-days: 14
