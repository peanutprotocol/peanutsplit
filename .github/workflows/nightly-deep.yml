name: Nightly deep verification

on:
  schedule:
    # After the quietest UTC window. The detector below exits cheaply when the
    # default branch has not moved since the last successful deep run.
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even when the last successful nightly tested this commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      run_deep: ${{ steps.changes.outputs.run_deep }}
      current_sha: ${{ steps.changes.outputs.current_sha }}
      previous_sha: ${{ steps.changes.outputs.previous_sha }}
    steps:
      - name: Compare with the last successful deep run
        id: changes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FORCE_DEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        with:
          script: |
            const current = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: current.data.workflow_id,
              branch: context.payload.repository.default_branch,
              status: 'completed',
              per_page: 100,
            })
            const previous = runs.find(
              (run) => run.id !== context.runId && run.conclusion === 'success'
            )
            const forced = process.env.FORCE_DEEP === 'true'
            const changed = !previous || previous.head_sha !== context.sha
            const runDeep = forced || changed

            core.setOutput('run_deep', String(runDeep))
            core.setOutput('current_sha', context.sha)
            core.setOutput('previous_sha', previous?.head_sha ?? '')

            await core.summary
              .addHeading('Nightly deep verification')
              .addTable([
                [{ data: 'Current default-branch commit', header: true }, context.sha],
                [{ data: 'Last successful deep commit', header: true }, previous?.head_sha ?? 'none'],
                [{ data: 'Forced', header: true }, String(forced)],
                [{ data: 'Run the deep suites', header: true }, String(runDeep)],
              ])
              .addRaw(
                runDeep
                  ? 'The default branch changed, so the deep suites will run.'
                  : 'No changes since the last successful deep run; expensive jobs were skipped.'
              )
              .write()

  verify:
    name: Full verification and production build
    needs: changes
    if: needs.changes.outputs.run_deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      TEST_DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      PEANUT_WEBHOOK_SECRET: local-dev-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peanut
          POSTGRES_PASSWORD: peanut
          POSTGRES_DB: peanut_split_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peanut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm bootstrap
      - run: pnpm --filter @peanut-split/api exec prisma migrate deploy
      - run: pnpm build
      - name: Start the API used by the settlement-loop verifier
        run: |
          pnpm --filter @peanut-split/api exec tsx src/index.ts > "${RUNNER_TEMP}/peanut-split-api.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5051/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/peanut-split-api.log"
          exit 1
      - run: pnpm verify

  browser:
    name: Browser journeys (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.run_deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true
      DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      # The Playwright webServer ignores DATABASE_URL entirely and pins its own from
      # E2E_DATABASE_URL, falling back to split:split@localhost:5433 — a port nothing
      # listens on here. Without this the app under test never reaches a database and
      # every room-creating spec fails on a refused connection that reads like an app bug.
      E2E_DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      E2E_BROWSER: ${{ matrix.browser }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peanut
          POSTGRES_PASSWORD: peanut
          POSTGRES_DB: peanut_split_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peanut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm bootstrap
      - run: pnpm --dir apps/web exec prisma migrate deploy
      - run: pnpm --dir apps/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --dir apps/web e2e
      - name: Keep the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  browser-v2:
    name: V2 browser journeys (chromium)
    needs: changes
    if: needs.changes.outputs.run_deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
      # The Playwright webServer ignores DATABASE_URL entirely and pins its own from
      # E2E_DATABASE_URL, falling back to split:split@localhost:5433 — a port nothing
      # listens on here. Without this the app under test never reaches a database and
      # every room-creating spec fails on a refused connection that reads like an app bug.
      E2E_DATABASE_URL: postgresql://peanut:peanut@localhost:5432/peanut_split_dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: peanut
          POSTGRES_PASSWORD: peanut
          POSTGRES_DB: peanut_split_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peanut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm bootstrap
      - run: pnpm --dir apps/web exec prisma migrate deploy
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web e2e:v2
      - name: Keep the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-v2-chromium-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
