# Flags known-malicious or vulnerable dependency changes at PR time.
# Advisory like the rest of split CI — Dokploy deploys main regardless.
name: Dependency review
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
