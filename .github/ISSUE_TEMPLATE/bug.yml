name: Bug report
description: Report a reproducible Peanut Split defect using synthetic data.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include room links, expense/member IDs, member tokens, names, amounts, receipts, or other real personal data.
        Do not attach a real room CSV, portable JSON, or history export. Known live capabilities are stripped, but the group's personal and financial data remains.
        Security issues belong in the private process described in SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact starting state, actions, and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit
      description: Exact immutable release or 40-character commit when known.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Official peanutsplit.com service
        - Self-hosted container
        - Local development
    validations:
      required: true
